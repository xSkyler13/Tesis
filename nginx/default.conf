# Única entrada pública de la app. Termina HTTPS y reenvía a Flask (web:5001),
# que solo escucha en la red interna de Docker / localhost.

# Límites de frecuencia por IP (ataques de fuerza bruta y saturación de CPU)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reconocimiento:10m rate=4r/s;
limit_req_status 429;

# No anunciar la versión de nginx
server_tokens off;

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Las fotos en base64 pesan < 1 MB; Flask además corta en 5 MB
    client_max_body_size 6m;

    # Cabeceras de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # En el hosting, con dominio real y certificado válido, activar HSTS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_flask.inc;
    }

    # Cada imagen pasa por dlib (CPU intensivo): la cámara envía ~2 frames/s
    location = /recognize {
        limit_req zone=reconocimiento burst=8 nodelay;
        include /etc/nginx/conf.d/proxy_flask.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_flask.inc;
    }
}

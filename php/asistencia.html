<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistencia - Reconocimiento Facial</title>
    <style>
        body {font-family: Arial; text-align: center; background: #f4f4f4; margin: 0; padding: 20px;}
        .stage {position: relative; width: 900px; margin: 20px auto;}
        #video {border: 8px solid #333; border-radius: 20px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: scaleX(-1);}
        #overlay {position: absolute; top: 8px; left: 8px; pointer-events: none; transform: scaleX(-1);}
        .status {
            font-size: 32px; font-weight: bold; padding: 25px; border-radius: 15px;
            margin: 20px auto; width: 90%; max-width: 900px; min-height: 80px;
            transition: all 0.4s;
        }
        .acceso { background: #d4edda; color: #155724; border: 3px solid #28a745; }
        .denegado { background: #f8d7da; color: #721c24; border: 3px solid #dc3545; }
        .esperando { background: #fff3cd; color: #856404; }
        .reto { background: #cce5ff; color: #004085; border: 3px solid #007bff; }
    </style>
</head>
<body>
    <h1>🔍 Reconocimiento Facial - Asistencia</h1>

    <div class="stage">
        <video id="video" width="900" height="600" autoplay playsinline></video>
        <canvas id="overlay" width="884" height="584"></canvas>
    </div>

    <div id="status" class="status esperando">Esperando detección de rostro...</div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const octx = overlay.getContext('2d');
        const statusDiv = document.getElementById('status');

        const grab = document.createElement('canvas');
        grab.width = 884; grab.height = 584;
        const gctx = grab.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(() => { statusDiv.innerHTML = "❌ No se pudo acceder a la cámara"; });

        function drawBoxes(faces, color) {
            octx.clearRect(0, 0, overlay.width, overlay.height);
            (faces || []).forEach(f => {
                octx.strokeStyle = color;
                octx.lineWidth = 3;
                octx.strokeRect(f.left, f.top, f.right - f.left, f.bottom - f.top);
            });
        }

        let approvedUntil = 0;   // congela mensaje de acceso unos segundos
        let busy = false;

        async function tick() {
            if (busy || video.readyState !== 4) return;
            // Mantener "acceso concedido" visible un momento
            if (Date.now() < approvedUntil) return;
            busy = true;
            try {
                gctx.drawImage(video, 0, 0, grab.width, grab.height);
                const image = grab.toDataURL('image/jpeg', 0.7);
                const fd = new FormData();
                fd.append('image', image);
                const res = await fetch('/recognize', { method: 'POST', body: fd, credentials: 'same-origin' });
                const data = await res.json();

                switch (data.status) {
                    case 'approved':
                        drawBoxes(data.faces, "#28a745");
                        statusDiv.className = "status acceso";
                        statusDiv.innerHTML = `✅ ¡Bienvenido ${data.name}! <br><small>Acceso concedido — verificación de vida OK</small>`;
                        approvedUntil = Date.now() + 4000;
                        break;
                    case 'challenge':
                        drawBoxes(data.faces, "#007bff");
                        statusDiv.className = "status reto";
                        let dbg = "";
                        if (data.debug) {
                            dbg = "<br><small style='font-family:monospace;opacity:0.7'>" +
                                  Object.entries(data.debug).map(([k,v]) => `${k}=${v}`).join("  ") +
                                  "</small>";
                        }
                        statusDiv.innerHTML = `🔐 ${data.name} detectado<br>Verificación de vida: <b>${data.instruction}</b>`;
                        break;
                    case 'unknown':
                        drawBoxes(data.faces, "#dc3545");
                        statusDiv.className = "status denegado";
                        statusDiv.innerHTML = "❌ Persona no registrada";
                        break;
                    default: // no_face / error
                        octx.clearRect(0, 0, overlay.width, overlay.height);
                        statusDiv.className = "status esperando";
                        statusDiv.innerHTML = "👀 Esperando detección de rostro...";
                }
            } catch (e) {
                console.log("Error recognize", e);
            }
            busy = false;
        }
        setInterval(tick, 500);
    </script>
    <!-- <script src="../statics/js/session.js"></script> -->
</body>
</html>

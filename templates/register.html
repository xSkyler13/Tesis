<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f4f4f4; }
        form { display: inline-block; text-align: left; background: #fff; padding: 30px; border-radius: 12px; margin-top: 30px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select { padding: 10px; width: 360px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { padding: 12px 30px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; }
        .btn-primary   { background: #007bff; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-success   { background: #28a745; color: #fff; }
        .error   { color: red;   font-size: 14px; margin-top: 6px; }
        .success { color: green; font-size: 16px; }

        /* Vista previa foto capturada */
        #preview-container { margin-top: 8px; }
        #preview-img { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; border: 2px solid #28a745; display: none; }
        #foto-label-status { font-size: 13px; color: #555; margin-top: 4px; }

        /* Modal */
        #modal-camara {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #modal-camara.activo { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            width: 680px;
            max-width: 95vw;
        }
        .modal-box h2 { margin-top: 0; }
        #video-cam {
            width: 100%;
            max-width: 640px;
            border-radius: 8px;
            border: 3px solid #333;
        }
        .modal-actions { margin-top: 16px; display: flex; gap: 12px; justify-content: center; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>Registro de Nuevo Usuario</h1>
    <div id="mensaje"></div>
    <form id="form-registro">
        <input type="hidden" name="accion" value="registrar">
        <input type="hidden" name="foto_base64" id="foto_base64">

        <div class="form-group">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-group">
            <label for="rol_id">Rol:</label>
                <select id="rol_id" name="rol_id" required>
                    <option value="">Cargando roles...</option>
                </select>
        </div>

        <div class="form-group">
            <label>Foto de rostro:</label>
            <button type="button" class="btn-primary" id="btn-abrir-camara">📷 Tomar foto</button>
            <div id="preview-container">
                <img id="preview-img" src="" alt="Foto capturada">
                <div id="foto-label-status">Sin foto capturada</div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Registrar</button>
            <button type="reset" class="btn-secondary" style="margin-left:10px;" id="btn-limpiar">Limpiar</button>
        </div>
    </form>

    <!-- Modal cámara -->
    <div id="modal-camara">
        <div class="modal-box">
            <h2>📸 Capturar foto</h2>
            <div id="intentos-label" style="margin-bottom:10px; font-size:14px; color:#555;">
                Intentos restantes: <strong id="intentos-num">3</strong>
            </div>
            <video id="video-cam" autoplay playsinline></video>
            <canvas id="canvas-cam" width="640" height="480"></canvas>
            <div class="modal-actions">
                <button type="button" class="btn-success" id="btn-capturar">📸 Capturar</button>
                <button type="button" class="btn-secondary" id="btn-cerrar-modal">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="../statics/js/api_register_user.js"></script>
</body>
</html>

<!-- MODAL EDITAR CUENTA -->
<div id="modal-cuenta" class="modal-overlay">
	<div class="modal-box modal-box-form">
		<div class="head"><h3><i class='bx bxs-cog icon'></i> Editar Cuenta</h3></div>
		<div id="modal-cuenta-mensaje"></div>
		<form id="form-editar-cuenta">
			<input type="hidden" id="cuenta-id" name="id">
			<input type="hidden" id="cuenta-foto-base64" name="foto_base64">
			<div class="photo-upload">
				<img id="cuenta-foto-preview" class="photo-preview" src="" alt="" style="display:none;">
				<i class='bx bx-user-circle photo-placeholder' id="cuenta-foto-placeholder"></i>
				<input type="file" id="cuenta-foto-input" accept="image/*" hidden>
				<button type="button" class="btn-upload" id="btn-cambiar-foto"><i class='bx bx-camera'></i> Cambiar foto</button>
			</div>
			<div class="form-grid">
				<div class="field">
					<label for="cuenta-usuario">Usuario *</label>
					<input type="text" id="cuenta-usuario" name="usuario" required>
				</div>
				<div class="field">
					<label for="cuenta-correo">Correo</label>
					<input type="email" id="cuenta-correo" name="correo">
				</div>
				<div class="field">
					<label for="cuenta-password-actual">Contraseña Actual</label>
					<input type="password" id="cuenta-password-actual" name="password_actual" autocomplete="current-password">
					<span class="field-hint">Solo necesaria si vas a cambiar la contraseña</span>
				</div>
				<div class="field">
					<label for="cuenta-password-nueva">Nueva Contraseña</label>
					<input type="password" id="cuenta-password-nueva" name="password_nueva" autocomplete="new-password">
					<span class="field-hint">Dejar en blanco para no cambiarla</span>
				</div>
			</div>
			<div class="modal-actions">
				<button type="button" class="btn-cancel" id="btn-cancelar-cuenta">Cancelar</button>
				<button type="submit" class="btn-save"><i class='bx bx-save'></i> Guardar</button>
			</div>
		</form>
	</div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../statics/fontawesome/all.min.css">
    <script src="../statics/js/jquery.min.js"></script>
    <link rel="stylesheet" href="../statics/css/style.css">
    <title>Login</title>
</head>

<body>
    <div class="container"> 
        <div class="forms-container">
            <div class="signin-signup">
                <form class="form_login">
                    <h2 class="title">Login</h2>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" name="usuario" id="usuario" placeholder="Username" >
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Password">
                    </div>
                    <input type="submit" name="accion" value="Ingresar" name="ingresar" class="btn solid">
                </form>
            </div>
        </div>
        
        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>Aplicativo</h3>
                    <p>
                        Aplicativo de control de acceso Anthon
                    </p>
                </div>
                <img src="../statics/img/log.svg" class="image" alt="" />
            </div>
        </div>
    </div>
    <script src="../statics/js/api_login_users.js"></script>
</body>
</html>

# Credenciales en .env (ver .env.example). La única entrada pública es nginx
# (HTTPS). Flask, MySQL y phpMyAdmin se publican solo en 127.0.0.1: accesibles
# desde esta máquina, nunca desde la red/internet.
# Ojo: Docker se salta el firewall (ufw), así que esto es lo que realmente los protege.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_flask.inc:/etc/nginx/conf.d/proxy_flask.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    ports:
      # Solo local: lo usa PHP (host) para sincronizar rostros. El público entra por nginx.
      - "127.0.0.1:5001:5001"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      # Solo se usa al inicializar un volumen vacío; con datos existentes se ignora
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  # Volumen ya existente con los datos (creado antes de pasar MySQL a compose)
  mysql_data:
    external: true
